name: spot_mobile
description: "Spot - Hyper-Local Geofenced Shopping & Merchant Media Ecosystem"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Geolocation & Geofencing
  geolocator: ^12.0.0
  latlong2: ^0.9.1

  # Local Push Notifications & Geofence Triggers
  flutter_local_notifications: ^17.2.2

  # Offline-First Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # State Management & Networking
  provider: ^6.1.2
  http: ^1.2.2
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
