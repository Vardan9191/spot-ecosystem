events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Allow large video uploads for Merchant Shorts (up to 100MB)
    client_max_body_size 100M;

    upstream spot_backend {
        server spot-api:8080;
    }

    server {
        listen 80;
        server_name _;

        # Merchant Web Dashboard (Static Portal)
        location /merchant/ {
            alias /usr/share/nginx/html/merchant-dashboard/;
            index index.html;
            try_files $uri $uri/ /merchant/index.html;
        }

        # Spot .NET 10 Web API Endpoints
        location /api/ {
            proxy_pass http://spot_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger / OpenAPI Documentation
        location /swagger/ {
            proxy_pass http://spot_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SignalR Real-Time Spatial WebSocket Hub
        location /hubs/ {
            proxy_pass http://spot_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Health Check
        location /health {
            proxy_pass http://spot_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Root Redirect to Merchant Portal
        location = / {
            return 301 /merchant/;
        }
    }
}
